<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">RustChain Proof of Antiquity — 60-second visual explainer</title>
  <desc id="desc">A flowchart explaining one CPU one vote, antiquity weighting, six-check hardware fingerprinting, VM near-zero weighting, and how to start with pip install clawrtc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#17233b"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <style>
      .title { font: 700 52px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .sub { font: 400 23px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .h { font: 700 25px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .b { font: 400 20px Arial, Helvetica, sans-serif; fill: #dbeafe; }
      .small { font: 400 17px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .mono { font: 700 22px Consolas, Menlo, monospace; fill: #d1fae5; }
      .pill { font: 700 17px Arial, Helvetica, sans-serif; fill: #0b1020; }
      .num { font: 700 34px Arial, Helvetica, sans-serif; fill: #0b1020; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="1250" cy="120" r="190" fill="#f97316" opacity="0.07"/>
  <circle cx="115" cy="820" r="210" fill="#38bdf8" opacity="0.06"/>

  <text x="80" y="88" class="title">RustChain: Proof of Antiquity</text>
  <text x="80" y="130" class="sub">A physical-hardware consensus model in one picture</text>

  <g filter="url(#shadow)"><rect x="80" y="185" width="285" height="210" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/></g>
  <circle cx="125" cy="230" r="27" fill="url(#rust)"/>
  <text x="114" y="242" class="num">1</text>
  <text x="165" y="238" class="h">Physical CPU</text>
  <rect x="118" y="272" width="112" height="78" rx="12" fill="#1e293b" stroke="#64748b"/>
  <rect x="135" y="289" width="78" height="44" rx="7" fill="#334155"/>
  <path d="M105 287h13M105 305h13M105 323h13M230 287h13M230 305h13M230 323h13M145 259v13M170 259v13M195 259v13M145 350v13M170 350v13M195 350v13" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <text x="250" y="290" class="b">1 CPU</text><text x="250" y="320" class="b">= 1 vote</text>
  <text x="118" y="380" class="small">Identity starts with a real machine.</text>

  <path d="M385 290H455" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M447 278l18 12-18 12" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)"><rect x="475" y="185" width="430" height="310" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/></g>
  <circle cx="520" cy="230" r="27" fill="#38bdf8"/>
  <text x="509" y="242" class="num">2</text>
  <text x="560" y="238" class="h">6-check hardware fingerprint</text>
  <g>
    <rect x="515" y="270" width="165" height="42" rx="21" fill="#f8fafc"/><text x="535" y="297" class="pill">Clock drift</text>
    <rect x="700" y="270" width="165" height="42" rx="21" fill="#f8fafc"/><text x="720" y="297" class="pill">Cache timing</text>
    <rect x="515" y="326" width="165" height="42" rx="21" fill="#f8fafc"/><text x="535" y="353" class="pill">SIMD identity</text>
    <rect x="700" y="326" width="165" height="42" rx="21" fill="#f8fafc"/><text x="720" y="353" class="pill">Thermal entropy</text>
    <rect x="515" y="382" width="165" height="42" rx="21" fill="#f8fafc"/><text x="535" y="409" class="pill">Instr. jitter</text>
    <rect x="700" y="382" width="165" height="42" rx="21" fill="#f8fafc"/><text x="720" y="409" class="pill">Anti-emulation</text>
  </g>
  <text x="515" y="462" class="small">Goal: distinguish persistent physical behavior from emulation.</text>

  <path d="M925 290H995" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M987 278l18 12-18 12" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)"><rect x="1015" y="185" width="305" height="310" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/></g>
  <circle cx="1060" cy="230" r="27" fill="#a78bfa"/>
  <text x="1049" y="242" class="num">3</text>
  <text x="1100" y="238" class="h">Antiquity weight</text>
  <text x="1055" y="295" class="b">Older / rarer hardware</text>
  <path d="M1070 350H1255" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  <circle cx="1100" cy="350" r="16" fill="#f8fafc"/><circle cx="1170" cy="350" r="20" fill="#fbbf24"/><circle cx="1240" cy="350" r="25" fill="#f97316"/>
  <text x="1068" y="392" class="small">modern</text><text x="1150" y="392" class="small">older</text><text x="1220" y="392" class="small">vintage</text>
  <text x="1055" y="440" class="b">Vote stays one CPU.</text><text x="1055" y="470" class="b">Reward weight rises with antiquity.</text>

  <path d="M690 520V565" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M678 557l12 18 12-18" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)"><rect x="80" y="590" width="590" height="175" rx="24" fill="#0f2a24" stroke="#34d399" stroke-width="2"/></g>
  <circle cx="130" cy="642" r="28" fill="#34d399"/>
  <path d="M116 642l10 10 20-22" fill="none" stroke="#052e2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="175" y="638" class="h">Real hardware → eligible participation</text>
  <text x="175" y="676" class="b">Consistent physical fingerprint + antiquity weighting</text>
  <text x="175" y="708" class="small">The machine earns according to the network's current reward rules.</text>
  <rect x="175" y="725" width="235" height="30" rx="15" fill="#34d399"/><text x="195" y="746" class="pill">physical identity matters</text>

  <g filter="url(#shadow)"><rect x="730" y="590" width="590" height="175" rx="24" fill="#2b1720" stroke="#fb7185" stroke-width="2"/></g>
  <circle cx="780" cy="642" r="28" fill="#fb7185"/>
  <path d="M767 629l26 26M793 629l-26 26" stroke="#3f0d18" stroke-width="6" stroke-linecap="round"/>
  <text x="825" y="638" class="h">VM / emulator → near-zero weight</text>
  <text x="825" y="676" class="b">Anti-emulation checks reduce virtual-farm incentives</text>
  <text x="825" y="708" class="small">RustChain's public docs describe VM rewards as effectively negligible.</text>
  <rect x="825" y="725" width="236" height="30" rx="15" fill="#fb7185"/><text x="845" y="746" class="pill">no fake hardware identity</text>

  <rect x="80" y="805" width="1240" height="58" rx="18" fill="#0b1220" stroke="#475569"/>
  <text x="110" y="842" class="h">Start:</text><text x="205" y="842" class="mono">pip install clawrtc</text>
  <text x="735" y="842" class="small">Original SVG • @antoleod • AI-assisted design • bounty #13954</text>
</svg>
